<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CRM AO — Veolia Nouvelle-Aquitaine</title>
<style>
  :root {
    --color-bg: #f4f5f7;
    --color-surface: #ffffff;
    --color-border: #e0e2e7;
    --color-text: #1c1f26;
    --color-text-muted: #6b7280;
    --color-primary: #0f766e;
    --color-primary-hover: #0d5f59;
    --color-danger: #dc2626;
    --radius: 8px;
    --header-height: 56px;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    background: var(--color-bg);
    color: var(--color-text);
  }

  header {
    height: var(--header-height);
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 16px;
    background: var(--color-surface);
    border-bottom: 1px solid var(--color-border);
    position: sticky;
    top: 0;
    z-index: 10;
  }

  header .app-title {
    font-weight: 600;
    font-size: 15px;
    white-space: nowrap;
  }

  nav {
    display: flex;
    gap: 4px;
    overflow-x: auto;
  }

  nav button {
    border: none;
    background: transparent;
    padding: 8px 14px;
    border-radius: var(--radius);
    font-size: 14px;
    color: var(--color-text-muted);
    cursor: pointer;
    white-space: nowrap;
  }

  nav button:hover {
    background: var(--color-bg);
  }

  nav button.active {
    background: var(--color-primary);
    color: #fff;
  }

  #reminder-bell {
    position: relative;
    border: none;
    background: transparent;
    cursor: pointer;
    font-size: 18px;
    padding: 6px 10px;
  }

  #reminder-count {
    position: absolute;
    top: 0;
    right: 0;
    background: var(--color-danger);
    color: #fff;
    font-size: 10px;
    line-height: 1;
    padding: 2px 5px;
    border-radius: 999px;
    display: none;
  }

  .header-actions {
    display: flex;
    align-items: center;
    gap: 4px;
  }

  .header-actions button {
    border: 1px solid var(--color-border);
    background: var(--color-surface);
    padding: 6px 10px;
    border-radius: var(--radius);
    font-size: 13px;
    cursor: pointer;
    white-space: nowrap;
  }

  .header-actions button:hover {
    background: var(--color-bg);
  }

  #storage-status {
    max-width: 1100px;
    margin: 0 auto;
    padding: 8px 16px;
    font-size: 12px;
    color: var(--color-text-muted);
  }

  main {
    max-width: 1100px;
    margin: 24px auto;
    padding: 0 16px;
  }

  .screen {
    display: none;
  }

  .screen.active {
    display: block;
  }

  .screen h1 {
    font-size: 20px;
    margin: 0 0 16px;
  }

  .placeholder {
    background: var(--color-surface);
    border: 1px dashed var(--color-border);
    border-radius: var(--radius);
    padding: 32px;
    color: var(--color-text-muted);
    font-size: 14px;
    text-align: center;
  }
</style>
</head>
<body>

<header>
  <span class="app-title">VEOLIA CRM</span>
  <nav id="main-nav">
    <button data-screen="accueil" class="active">Accueil</button>
    <button data-screen="pipeline">Pipeline</button>
    <button data-screen="todo">ToDo</button>
    <button data-screen="contacts">Contacts</button>
    <button data-screen="reporting">Reporting</button>
  </nav>
  <div class="header-actions">
    <button id="btn-export">⬇ Exporter</button>
    <button id="btn-import">⬆ Importer</button>
    <input type="file" id="file-import" accept="application/json" hidden>
    <button id="reminder-bell" title="Rappels">
      🔔<span id="reminder-count">0</span>
    </button>
  </div>
</header>

<div id="storage-status">Chargement des données…</div>

<main>
  <section class="screen active" id="screen-accueil">
    <h1>Accueil</h1>
    <div class="placeholder">Récap à construire à l'étape 4.</div>
  </section>

  <section class="screen" id="screen-pipeline">
    <h1>Pipeline</h1>
    <div class="placeholder">Vue Kanban à construire à l'étape 5.</div>
  </section>

  <section class="screen" id="screen-todo">
    <h1>ToDo</h1>
    <div class="placeholder">Vue tâches à construire à l'étape 6.</div>
  </section>

  <section class="screen" id="screen-contacts">
    <h1>Contacts</h1>
    <div class="placeholder">Annuaire à construire à l'étape 7.</div>
  </section>

  <section class="screen" id="screen-reporting">
    <h1>Reporting</h1>
    <div class="placeholder">Statistiques à construire à l'étape 9.</div>
  </section>
</main>

<script>
(() => {
  "use strict";

  // ---------------------------------------------------------------------
  // Interface de l'adaptateur de stockage (voir PROJET.md §3).
  //
  // Toute implémentation de stockage (LocalStorage, Supabase, Google Drive...)
  // doit exposer exactement ces quatre méthodes. Le reste de l'app ne doit
  // jamais accéder à un mécanisme de stockage autrement que via cet objet.
  //
  //   load()        -> Promise<object>   toutes les données { aos, taches, contacts }
  //   save(data)     -> Promise<void>     enregistre l'intégralité des données
  //   subscribe(cb)  -> function          s'abonne aux changements, renvoie une fonction de désabonnement
  //   meta()         -> Promise<object>   { lastModified, modifiedBy } — anti-conflit
  // ---------------------------------------------------------------------

  const STORAGE_ADAPTER_METHODS = ["load", "save", "subscribe", "meta"];

  function assertStorageAdapter(adapter) {
    for (const method of STORAGE_ADAPTER_METHODS) {
      if (typeof adapter[method] !== "function") {
        throw new Error(`StorageAdapter invalide : méthode "${method}" manquante.`);
      }
    }
    return adapter;
  }

  // ---------------------------------------------------------------------
  // LocalStorageAdapter (étape 2).
  //
  // Stocke le blob complet des données sous une seule clé localStorage.
  // L'anti-conflit (§6) se fait au niveau du blob entier : chaque adaptateur
  // retient le `lastModified` vu à son dernier load()/save(). Si la valeur en
  // localStorage a changé depuis (écriture depuis un autre onglet), save()
  // refuse d'écraser et lève StorageConflictError — l'appelant doit alors
  // recharger (load) avant de retenter.
  // ---------------------------------------------------------------------

  const STORAGE_KEY = "crm_ao_data_v1";
  const USER_KEY = "crm_ao_current_user";

  function getCurrentUser() {
    let user = localStorage.getItem(USER_KEY);
    if (!user) {
      user = (window.prompt("Ton prénom, pour identifier tes modifications :") || "").trim();
      if (user) localStorage.setItem(USER_KEY, user);
    }
    return user || "Inconnu";
  }

  function emptyData() {
    return {
      aos: [],
      taches: [],
      contacts: [],
      _meta: { lastModified: null, modifiedBy: null },
    };
  }

  class StorageConflictError extends Error {
    constructor() {
      super("Les données ont été modifiées ailleurs entre-temps. Recharge avant de réessayer.");
      this.name = "StorageConflictError";
    }
  }

  class LocalStorageAdapter {
    constructor(key = STORAGE_KEY) {
      this.key = key;
      this._lastKnownModified = undefined;
      this._listeners = new Set();
      window.addEventListener("storage", (event) => {
        if (event.key === this.key) {
          this._listeners.forEach((cb) => cb());
        }
      });
    }

    _read() {
      const raw = localStorage.getItem(this.key);
      const data = raw ? JSON.parse(raw) : emptyData();
      if (!data._meta) data._meta = { lastModified: null, modifiedBy: null };
      return data;
    }

    async load() {
      const data = this._read();
      this._lastKnownModified = data._meta.lastModified;
      return data;
    }

    async save(data) {
      const current = this._read();
      if (this._lastKnownModified !== undefined && current._meta.lastModified !== this._lastKnownModified) {
        throw new StorageConflictError();
      }
      const toStore = {
        ...data,
        _meta: {
          lastModified: new Date().toISOString(),
          modifiedBy: getCurrentUser(),
        },
      };
      localStorage.setItem(this.key, JSON.stringify(toStore));
      this._lastKnownModified = toStore._meta.lastModified;
      return toStore._meta;
    }

    subscribe(cb) {
      this._listeners.add(cb);
      return () => this._listeners.delete(cb);
    }

    async meta() {
      return this._read()._meta;
    }
  }

  // Adaptateur actif.
  const storageAdapter = assertStorageAdapter(new LocalStorageAdapter());

  // ---------------------------------------------------------------------
  // Export / import JSON manuel (filet de sécurité, §6).
  // ---------------------------------------------------------------------

  function isValidCrmData(data) {
    return data && Array.isArray(data.aos) && Array.isArray(data.taches) && Array.isArray(data.contacts);
  }

  function downloadJSON(data) {
    const blob = new Blob([JSON.stringify(data, null, 2)], { type: "application/json" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = `crm-ao-export-${new Date().toISOString().slice(0, 10)}.json`;
    document.body.appendChild(a);
    a.click();
    a.remove();
    URL.revokeObjectURL(url);
  }

  function readJSONFile(file) {
    return new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onload = () => {
        try {
          resolve(JSON.parse(reader.result));
        } catch (err) {
          reject(err);
        }
      };
      reader.onerror = () => reject(reader.error);
      reader.readAsText(file);
    });
  }

  // ---------------------------------------------------------------------
  // État applicatif + statut de stockage.
  // ---------------------------------------------------------------------

  let appData = emptyData();
  const statusEl = document.getElementById("storage-status");

  function renderStorageStatus() {
    const meta = appData._meta || {};
    const counts = `${appData.aos.length} AO · ${appData.taches.length} tâches · ${appData.contacts.length} contacts`;
    const saved = meta.lastModified
      ? `dernière sauvegarde ${new Date(meta.lastModified).toLocaleString("fr-FR")} par ${meta.modifiedBy}`
      : "aucune donnée enregistrée pour l'instant";
    statusEl.textContent = `${counts} — ${saved}`;
  }

  async function refreshFromStorage() {
    appData = await storageAdapter.load();
    renderStorageStatus();
  }

  storageAdapter.subscribe(refreshFromStorage);
  refreshFromStorage();

  // ---------------------------------------------------------------------
  // Modèle de données (étape 3, voir PROJET.md §4).
  //
  // Trois entités : AO, Tâches, Contacts, chacune avec last_modified /
  // modified_by (§6). Les relations (contacts_lies / taches_liees / ao_lie /
  // ao_lies) sont dénormalisées des deux côtés et resynchronisées ici.
  //
  // Chaque mutation recharge l'état le plus frais depuis l'adaptateur avant
  // d'écrire (verrouillage au niveau de l'enregistrement, pas du fichier
  // global) : si l'enregistrement visé a changé depuis la version de base
  // fournie par l'appelant, une RecordConflictError est levée sans écraser
  // le travail de l'autre personne.
  // ---------------------------------------------------------------------

  const PHASE_OPTIONS = [
    "A venir", "Étude", "Finalisation", "🤝 Négociation",
    "⏳ En attente de réponse", "✅ Gagné", "❌ Perdu", "🚫 Abandonné",
  ];
  const TYPE_CLIENT_OPTIONS = ["Habitat", "Collectivité", "Santé", "Enseignement", "Tertiaire", "Autre"];
  const TYPE_AO_OPTIONS = ["Appel d'offres", "Renouvellement", "Avenant", "Sollicitation directe", "Proposition travaux"];
  const TYPE_MARCHE_OPTIONS = ["P1", "P2", "P3", "CPE", "R1", "R2", "GTR", "Gaz"];
  const RESULTAT_OPTIONS = ["En cours", "Gagné", "Perdu", "Abandonné"];
  const STATUT_TACHE_OPTIONS = ["Pas commencé", "En cours", "Terminé"];
  const PRIORITE_OPTIONS = ["Normale", "Haute"];
  const DECLENCHEMENT_OPTIONS = [
    "Sur date manuelle", "X jours avant échéance remise", "X jours avant visite", "X jours avant prise d'effet",
  ];

  function generateId() {
    if (window.crypto && crypto.randomUUID) return crypto.randomUUID();
    return `id-${Date.now()}-${Math.random().toString(36).slice(2, 9)}`;
  }

  function stamp(record) {
    record.last_modified = new Date().toISOString();
    record.modified_by = getCurrentUser();
    return record;
  }

  class RecordConflictError extends Error {
    constructor(entityType, id) {
      super(`Cet enregistrement (${entityType} #${id}) a été modifié par quelqu'un d'autre entre-temps.`);
      this.name = "RecordConflictError";
      this.entityType = entityType;
      this.id = id;
    }
  }

  function findOrThrow(list, id, label) {
    const record = list.find((r) => r.id === id);
    if (!record) throw new Error(`${label} ${id} introuvable.`);
    return record;
  }

  function checkRecordConflict(record, entityType, id, baseLastModified) {
    if (baseLastModified !== undefined && record.last_modified !== baseLastModified) {
      throw new RecordConflictError(entityType, id);
    }
  }

  function createRappel(partial = {}) {
    return {
      date: null,
      declenchement: "Sur date manuelle",
      jours_avant: null,
      message: "",
      actif: true,
      ...partial,
    };
  }

  function createAO(partial = {}) {
    return stamp({
      id: generateId(),
      nom_projet: "",
      type_client: "Habitat",
      phase: "A venir",
      type: "Appel d'offres",
      type_marche: [],
      valeur_estimee_keur: null,
      amo: "",
      concurrence: "",
      date_remise: null,
      date_visite: null,
      date_prise_effet: null,
      lieu: "",
      notes: "",
      fichiers: [],
      resultat: "En cours",
      motif: "",
      rappel: null,
      contacts_lies: [],
      taches_liees: [],
      ...partial,
    });
  }

  function createTache(partial = {}) {
    return stamp({
      id: generateId(),
      tache: "",
      statut: "Pas commencé",
      echeance: null,
      assigne_a: "",
      priorite: "Normale",
      notes: "",
      rappel: null,
      ao_lie: null,
      ...partial,
    });
  }

  function createContact(partial = {}) {
    return stamp({
      id: generateId(),
      nom: "",
      fonction: "",
      organisme: "",
      telephone: "",
      email: "",
      adresse: "",
      notes: "",
      rappel: null,
      ao_lies: [],
      ...partial,
    });
  }

  async function mutateData(mutateFn, attempt = 0) {
    const freshData = await storageAdapter.load();
    mutateFn(freshData);
    appData = freshData;
    try {
      await storageAdapter.save(appData);
    } catch (err) {
      if (err instanceof StorageConflictError && attempt < 2) {
        return mutateData(mutateFn, attempt + 1);
      }
      throw err;
    }
    renderStorageStatus();
    return appData;
  }

  // --- AO ---

  async function addAO(partial) {
    return mutateData((data) => { data.aos.push(createAO(partial)); });
  }

  async function updateAO(id, changes, baseLastModified) {
    return mutateData((data) => {
      const record = findOrThrow(data.aos, id, "AO");
      checkRecordConflict(record, "ao", id, baseLastModified);
      Object.assign(record, changes);
      stamp(record);
    });
  }

  async function deleteAO(id, baseLastModified) {
    return mutateData((data) => {
      const record = findOrThrow(data.aos, id, "AO");
      checkRecordConflict(record, "ao", id, baseLastModified);
      data.aos = data.aos.filter((r) => r.id !== id);
      data.taches.forEach((t) => { if (t.ao_lie === id) t.ao_lie = null; });
      data.contacts.forEach((c) => { c.ao_lies = (c.ao_lies || []).filter((aid) => aid !== id); });
    });
  }

  // --- Tâches ---

  async function addTache(partial) {
    return mutateData((data) => {
      const tache = createTache(partial);
      data.taches.push(tache);
      if (tache.ao_lie) {
        const ao = data.aos.find((a) => a.id === tache.ao_lie);
        if (ao && !ao.taches_liees.includes(tache.id)) ao.taches_liees.push(tache.id);
      }
    });
  }

  async function updateTache(id, changes, baseLastModified) {
    return mutateData((data) => {
      const record = findOrThrow(data.taches, id, "Tâche");
      checkRecordConflict(record, "tache", id, baseLastModified);
      const previousAoLie = record.ao_lie;
      Object.assign(record, changes);
      stamp(record);
      if (previousAoLie !== record.ao_lie) {
        if (previousAoLie) {
          const prevAo = data.aos.find((a) => a.id === previousAoLie);
          if (prevAo) prevAo.taches_liees = prevAo.taches_liees.filter((tid) => tid !== id);
        }
        if (record.ao_lie) {
          const newAo = data.aos.find((a) => a.id === record.ao_lie);
          if (newAo && !newAo.taches_liees.includes(id)) newAo.taches_liees.push(id);
        }
      }
    });
  }

  async function deleteTache(id, baseLastModified) {
    return mutateData((data) => {
      const record = findOrThrow(data.taches, id, "Tâche");
      checkRecordConflict(record, "tache", id, baseLastModified);
      data.taches = data.taches.filter((r) => r.id !== id);
      if (record.ao_lie) {
        const ao = data.aos.find((a) => a.id === record.ao_lie);
        if (ao) ao.taches_liees = ao.taches_liees.filter((tid) => tid !== id);
      }
    });
  }

  // --- Contacts ---

  async function addContact(partial) {
    return mutateData((data) => {
      const contact = createContact(partial);
      data.contacts.push(contact);
      (contact.ao_lies || []).forEach((aoId) => {
        const ao = data.aos.find((a) => a.id === aoId);
        if (ao && !ao.contacts_lies.includes(contact.id)) ao.contacts_lies.push(contact.id);
      });
    });
  }

  async function updateContact(id, changes, baseLastModified) {
    return mutateData((data) => {
      const record = findOrThrow(data.contacts, id, "Contact");
      checkRecordConflict(record, "contact", id, baseLastModified);
      const previousAoLies = record.ao_lies || [];
      Object.assign(record, changes);
      stamp(record);
      const newAoLies = record.ao_lies || [];
      previousAoLies.filter((aid) => !newAoLies.includes(aid)).forEach((aid) => {
        const ao = data.aos.find((a) => a.id === aid);
        if (ao) ao.contacts_lies = ao.contacts_lies.filter((cid) => cid !== id);
      });
      newAoLies.filter((aid) => !previousAoLies.includes(aid)).forEach((aid) => {
        const ao = data.aos.find((a) => a.id === aid);
        if (ao && !ao.contacts_lies.includes(id)) ao.contacts_lies.push(id);
      });
    });
  }

  async function deleteContact(id, baseLastModified) {
    return mutateData((data) => {
      const record = findOrThrow(data.contacts, id, "Contact");
      checkRecordConflict(record, "contact", id, baseLastModified);
      data.contacts = data.contacts.filter((r) => r.id !== id);
      data.aos.forEach((ao) => { ao.contacts_lies = (ao.contacts_lies || []).filter((cid) => cid !== id); });
    });
  }

  document.getElementById("btn-export").addEventListener("click", () => {
    downloadJSON(appData);
  });

  document.getElementById("btn-import").addEventListener("click", () => {
    document.getElementById("file-import").click();
  });

  document.getElementById("file-import").addEventListener("change", async (event) => {
    const file = event.target.files[0];
    event.target.value = "";
    if (!file) return;

    let imported;
    try {
      imported = await readJSONFile(file);
    } catch (err) {
      alert("Fichier JSON invalide : impossible de le lire.");
      return;
    }
    if (!isValidCrmData(imported)) {
      alert("Ce fichier ne correspond pas au format attendu (aos / taches / contacts).");
      return;
    }
    if (!confirm("Importer ce fichier va remplacer toutes les données actuelles. Continuer ?")) {
      return;
    }

    await storageAdapter.load();
    await storageAdapter.save(imported);
    await refreshFromStorage();
    alert("Import terminé.");
  });

  // ---------------------------------------------------------------------
  // Routage simple entre les écrans.
  // ---------------------------------------------------------------------

  const nav = document.getElementById("main-nav");

  function showScreen(name) {
    document.querySelectorAll(".screen").forEach((el) => {
      el.classList.toggle("active", el.id === `screen-${name}`);
    });
    nav.querySelectorAll("button").forEach((btn) => {
      btn.classList.toggle("active", btn.dataset.screen === name);
    });
  }

  nav.addEventListener("click", (event) => {
    const btn = event.target.closest("button[data-screen]");
    if (btn) showScreen(btn.dataset.screen);
  });

  window.CRM = {
    assertStorageAdapter,
    showScreen,
    storageAdapter,
    getData: () => appData,
    options: {
      PHASE_OPTIONS,
      TYPE_CLIENT_OPTIONS,
      TYPE_AO_OPTIONS,
      TYPE_MARCHE_OPTIONS,
      RESULTAT_OPTIONS,
      STATUT_TACHE_OPTIONS,
      PRIORITE_OPTIONS,
      DECLENCHEMENT_OPTIONS,
    },
    createAO, createTache, createContact, createRappel,
    addAO, updateAO, deleteAO,
    addTache, updateTache, deleteTache,
    addContact, updateContact, deleteContact,
    RecordConflictError,
  };
})();
</script>

</body>
</html>
